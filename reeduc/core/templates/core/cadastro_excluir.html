{% extends "core/base.html" %}
{% load static %}

{% block title %}Excluir Cadastro{% endblock %}
{% block nav_cadastros %}active{% endblock %}

{% block content %}
                <h1>Excluir Cadastro</h1>
                <div class="form">
                    <p>Tem certeza que deseja excluir o cadastro <strong>{{ cadastro.nome }}</strong>?</p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="actions">
                            <button type="submit" class="btn btn--danger">Excluir</button>
                            <a class="btn btn--ghost" href="/home/cadastros">Cancelar</a>
                        </div>
                    </form>
                </div>
{% endblock %}
