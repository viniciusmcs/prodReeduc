{% extends "core/base.html" %}
{% load static %}

{% block title %}Excluir Familiar{% endblock %}
{% block nav_familiares %}active{% endblock %}

{% block content %}
<h1>Excluir Familiar</h1>
<p>Tem certeza que deseja excluir <strong>{{ familiar.nome }}</strong>?</p>

<form method="post" style="margin-top: 12px;">
    {% csrf_token %}
    <button class="btn btn--danger" type="submit">Confirmar exclusão</button>
    <a class="btn btn--ghost" href="/familiares">Cancelar</a>
</form>
{% endblock %}
