{% extends "core/base.html" %}
{% load static %}

{% block title %}Excluir Usuário{% endblock %}

{% block nav_admin %}active{% endblock %}

{% block content %}
<h1>Excluir Usuário</h1>
<div class="form">
    <p>Tem certeza que deseja excluir o usuário <strong>{{ user_obj.username }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <div class="actions">
            <button type="submit" class="primary-button">Excluir</button>
            <a class="ghost-button" href="/administrar/usuarios">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
