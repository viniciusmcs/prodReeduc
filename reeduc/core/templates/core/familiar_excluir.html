{% extends "core/base.html" %}
{% load static %}

{% block title %}Excluir Familiar{% endblock %}
{% block nav_cadastros %}active{% endblock %}

{% block content %}
<h1>Excluir Familiar</h1>
<p>Tem certeza que deseja excluir <strong>{{ familiar.nome }}</strong>?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn--danger">Confirmar</button>
    <a class="btn btn--ghost" href="/cadastro/familiares/{{ familiar.cadastro_id }}">Cancelar</a>
</form>
{% endblock %}
